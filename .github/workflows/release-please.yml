name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Встроенный токен: PR и релизы создаются в этом же репозитории,
          # отдельный PAT не нужен (permissions выше это разрешают).
          token: ${{ secrets.GITHUB_TOKEN }}
